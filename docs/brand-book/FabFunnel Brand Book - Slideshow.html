<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FabFunnel — Brand Asset Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a17; font-family: 'Geist', sans-serif; height: 100%; overflow: hidden; }
  * { box-sizing: border-box; }
  #root { width: 100vw; height: 100vh; }

  .stage {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .artboard-wrap {
    position: relative;
    will-change: transform, opacity;
    transition: opacity 240ms ease, transform 240ms ease;
  }
  .artboard-scaler {
    transform-origin: top left;
    will-change: transform;
  }
  .artboard {
    background: #f6f4ef;
    border-radius: 14px;
    overflow: hidden;
    box-shadow:
      0 60px 120px -40px rgba(0,0,0,0.55),
      0 24px 48px -20px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.04);
  }

  /* HUD */
  .hud {
    position: fixed; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px;
    pointer-events: none;
    font-family: 'Geist Mono', ui-monospace, monospace;
    color: rgba(246,244,239,0.6);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    z-index: 10;
  }
  .hud.top { top: 0; }
  .hud.bottom { bottom: 0; font-size: 10.5px; }
  .hud .left, .hud .right, .hud .center { display: flex; align-items: center; gap: 14px; }
  .hud .center { color: rgba(246,244,239,0.85); }
  .pill {
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid rgba(246,244,239,0.14);
    background: rgba(246,244,239,0.04);
  }
  .pill.green { color: #c9e34a; border-color: rgba(143,184,33,0.35); background: rgba(143,184,33,0.08); }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: #8FB821; box-shadow: 0 0 0 3px rgba(143,184,33,0.18); }
  .seg {
    display: flex; gap: 4px;
  }
  .seg .tick {
    width: 18px; height: 3px; border-radius: 99px;
    background: rgba(246,244,239,0.14);
  }
  .seg .tick.active { background: #8FB821; }
  .seg .tick.done { background: rgba(246,244,239,0.35); }
  .hint {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%);
    pointer-events: none;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(20,20,18,0.78);
    border: 1px solid rgba(246,244,239,0.1);
    color: rgba(246,244,239,0.78);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    z-index: 10;
    opacity: 0;
    transition: opacity 400ms ease;
  }
  .hint.show { opacity: 1; }

  /* home button */
  .home-btn {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px 6px 8px; border-radius: 999px;
    border: 1px solid rgba(246,244,239,0.14);
    background: rgba(246,244,239,0.04);
    color: rgba(246,244,239,0.78);
    font: inherit; cursor: pointer;
    transition: all 160ms ease;
  }
  .home-btn:hover { color: #f6f4ef; border-color: rgba(246,244,239,0.3); background: rgba(246,244,239,0.08); }
  .home-btn .glyph { width: 14px; height: 14px; display: grid; place-items: center; }

  /* contents overlay */
  .sheet {
    position: fixed; inset: 0;
    background: rgba(12,12,11,0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 50;
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease;
  }
  .sheet.open { opacity: 1; pointer-events: auto; }
  .sheet-inner {
    width: min(1080px, 92vw);
    max-height: 86vh; overflow: auto;
    background: #1a1a17;
    border: 1px solid rgba(246,244,239,0.08);
    border-radius: 18px;
    padding: 28px 28px 24px;
    color: #f6f4ef;
    box-shadow: 0 60px 120px -30px rgba(0,0,0,0.6);
    transform: translateY(8px) scale(0.985);
    transition: transform 240ms cubic-bezier(.2,.7,.2,1);
  }
  .sheet.open .sheet-inner { transform: translateY(0) scale(1); }
  .sheet-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-bottom: 18px; margin-bottom: 18px;
    border-bottom: 1px solid rgba(246,244,239,0.08);
  }
  .sheet-title { font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .sheet-sub {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(246,244,239,0.5);
  }
  .sheet-close {
    pointer-events: auto;
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid rgba(246,244,239,0.12);
    background: transparent; color: rgba(246,244,239,0.7);
    cursor: pointer; font-size: 16px;
  }
  .sheet-close:hover { color: #f6f4ef; background: rgba(246,244,239,0.06); }

  .sec-group { margin-bottom: 22px; }
  .sec-head {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(246,244,239,0.5);
    margin-bottom: 10px;
  }
  .sec-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .sec-card {
    pointer-events: auto;
    text-align: left;
    padding: 14px 14px 12px;
    border-radius: 12px;
    border: 1px solid rgba(246,244,239,0.08);
    background: rgba(246,244,239,0.03);
    color: #f6f4ef;
    cursor: pointer;
    transition: all 160ms ease;
    display: flex; flex-direction: column; gap: 6px;
    font: inherit;
  }
  .sec-card:hover {
    border-color: rgba(143,184,33,0.45);
    background: rgba(143,184,33,0.06);
    transform: translateY(-1px);
  }
  .sec-card.active {
    border-color: rgba(143,184,33,0.65);
    background: rgba(143,184,33,0.1);
  }
  .sec-card .num {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.18em;
    color: rgba(246,244,239,0.45);
  }
  .sec-card .label { font-weight: 600; font-size: 15px; letter-spacing: -0.005em; }
  .sec-card .slug {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10.5px; color: rgba(246,244,239,0.4);
  }

  .share {
    margin-top: 8px; padding-top: 16px;
    border-top: 1px solid rgba(246,244,239,0.08);
    display: flex; align-items: center; gap: 12px;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 11px; color: rgba(246,244,239,0.55);
  }
  .share .url {
    flex: 1; min-width: 0;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(246,244,239,0.05);
    border: 1px solid rgba(246,244,239,0.08);
    color: #f6f4ef;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .share button {
    pointer-events: auto;
    padding: 8px 12px; border-radius: 8px;
    background: #8FB821; color: #1a1a17;
    border: none; cursor: pointer; font: inherit; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .share button:hover { filter: brightness(1.06); }
  .kbd {
    padding: 2px 6px; border-radius: 5px;
    background: rgba(246,244,239,0.08);
    border: 1px solid rgba(246,244,239,0.12);
    color: rgba(246,244,239,0.9);
    font-size: 10px;
  }

  /* nav arrow buttons */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 999px;
    display: grid; place-items: center;
    background: rgba(246,244,239,0.06);
    border: 1px solid rgba(246,244,239,0.14);
    color: rgba(246,244,239,0.75);
    cursor: pointer;
    z-index: 20;
    transition: all 180ms ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .nav-btn:hover {
    background: rgba(143,184,33,0.14);
    border-color: rgba(143,184,33,0.5);
    color: #f6f4ef;
    transform: translateY(-50%) scale(1.06);
  }
  .nav-btn:active { transform: translateY(-50%) scale(0.96); }
  .nav-btn:disabled {
    opacity: 0.28; cursor: not-allowed;
    background: rgba(246,244,239,0.03);
  }
  .nav-btn:disabled:hover { transform: translateY(-50%); border-color: rgba(246,244,239,0.14); color: rgba(246,244,239,0.75); }
  .nav-btn.left  { left: 22px; }
  .nav-btn.right { right: 22px; }
  .nav-btn svg { width: 22px; height: 22px; }

  /* enter anim */
  .artboard-wrap.enter { opacity: 0; transform: translateY(8px); }
  .artboard-wrap.enter-active { opacity: 1; transform: translateY(0); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="logos.jsx"></script>
<script type="text/babel" src="brand-book-1.jsx"></script>
<script type="text/babel" src="brand-book-2.jsx"></script>
<script type="text/babel" src="brand-book-3.jsx"></script>
<script type="text/babel" src="brand-book-4.jsx"></script>

<script type="text/babel">
const { Cover, HeroLockup, Anatomy, Variants } = window.BB1;
const { ClearSpace, MinSizes, DoDont, MonoUsage } = window.BB2;
const { ColorSystem, Typography, AppIcons } = window.BB3;
const { InContextApp, PrintApps, Swag, Social, FileInventory } = window.BB4;

const SLIDES = [
  { id: 'cover',      section: '01 · Identity',     label: 'Cover',            w: 1280, h: 860, Cmp: Cover },
  { id: 'hero',       section: '01 · Identity',     label: 'Primary lockup',   w: 1280, h: 620, Cmp: HeroLockup },
  { id: 'anatomy',    section: '01 · Identity',     label: 'Mark anatomy',     w: 1280, h: 780, Cmp: Anatomy },
  { id: 'variants',   section: '01 · Identity',     label: 'Approved variants',w: 1280, h: 780, Cmp: Variants },
  { id: 'clear-space',section: '02 · Logo usage',   label: 'Clear space',      w: 1280, h: 780, Cmp: ClearSpace },
  { id: 'min-sizes',  section: '02 · Logo usage',   label: 'Minimum sizes',    w: 1280, h: 780, Cmp: MinSizes },
  { id: 'do-dont',    section: '02 · Logo usage',   label: "Do & don't",       w: 1280, h: 780, Cmp: DoDont },
  { id: 'mono',       section: '02 · Logo usage',   label: 'Mono with detail', w: 1280, h: 780, Cmp: MonoUsage },
  { id: 'color',      section: '03 · Color & type', label: 'Color system',     w: 1280, h: 920, Cmp: ColorSystem },
  { id: 'type',       section: '03 · Color & type', label: 'Typography',       w: 1280, h: 780, Cmp: Typography },
  { id: 'app-icons',  section: '03 · Color & type', label: 'App icons',        w: 1280, h: 780, Cmp: AppIcons },
  { id: 'product-ui', section: '04 · In context',   label: 'Product UI',       w: 1280, h: 620, Cmp: InContextApp },
  { id: 'stationery', section: '04 · In context',   label: 'Stationery',       w: 1280, h: 620, Cmp: PrintApps },
  { id: 'swag',       section: '04 · In context',   label: 'Swag',             w: 1280, h: 620, Cmp: Swag },
  { id: 'social',     section: '04 · In context',   label: 'Social & OG',      w: 1280, h: 620, Cmp: Social },
  { id: 'files',      section: '05 · Files',        label: 'File inventory',   w: 1280, h: 780, Cmp: FileInventory },
];

const SLIDE_BY_ID = Object.fromEntries(SLIDES.map((s, i) => [s.id, i]));

function indexFromHash() {
  const h = (window.location.hash || '').replace(/^#\/?/, '');
  if (!h) return 0;
  if (h in SLIDE_BY_ID) return SLIDE_BY_ID[h];
  const n = parseInt(h, 10);
  if (!isNaN(n) && n >= 1 && n <= SLIDES.length) return n - 1;
  return 0;
}

function App() {
  const [idx, setIdx] = React.useState(() => indexFromHash());
  const [enter, setEnter] = React.useState(true);
  const [hint, setHint] = React.useState(true);
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  const [menuOpen, setMenuOpen] = React.useState(() => (window.location.hash || '').replace(/^#\/?/, '') === 'index');
  const [copied, setCopied] = React.useState(false);

  // hash <-> idx
  React.useEffect(() => {
    const slug = SLIDES[idx].id;
    const want = `#/${slug}`;
    if (window.location.hash !== want) {
      window.history.replaceState(null, '', want);
    }
    document.title = `FabFunnel — ${SLIDES[idx].label}`;
  }, [idx]);

  React.useEffect(() => {
    const onHash = () => setIdx(indexFromHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  React.useEffect(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // slide-in animation
  React.useEffect(() => {
    setEnter(true);
    const t = requestAnimationFrame(() => setEnter(false));
    return () => cancelAnimationFrame(t);
  }, [idx]);

  // hide hint after a few seconds
  React.useEffect(() => {
    const t = setTimeout(() => setHint(false), 4200);
    return () => clearTimeout(t);
  }, []);

  // keyboard nav
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); prev(); }
      else if (e.key === 'Home') setIdx(0);
      else if (e.key === 'End') setIdx(SLIDES.length - 1);
      else if (e.key === 'Escape') setMenuOpen(false);
      else if (e.key.toLowerCase() === 'i') setMenuOpen(m => !m);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  });

  function next() { setIdx(i => Math.min(i + 1, SLIDES.length - 1)); }
  function prev() { setIdx(i => Math.max(i - 1, 0)); }
  function jumpTo(i) { setIdx(i); setMenuOpen(false); }
  function copyLink() {
    const url = window.location.href;
    navigator.clipboard?.writeText(url).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 1400);
    });
  }

  // group slides by section for the menu
  const groups = React.useMemo(() => {
    const map = new Map();
    SLIDES.forEach((s, i) => {
      if (!map.has(s.section)) map.set(s.section, []);
      map.get(s.section).push({ ...s, i });
    });
    return [...map.entries()];
  }, []);

  const slide = SLIDES[idx];
  // scale to fit viewport with a margin for HUD
  const margin = 96;
  const sx = (vp.w - margin * 2) / slide.w;
  const sy = (vp.h - margin * 2) / slide.h;
  const scale = Math.min(sx, sy, 1.05);

  return (
    <React.Fragment>
      <div className="stage">
        <div
          key={slide.id}
          className={`artboard-wrap ${enter ? 'enter' : 'enter-active'}`}
          style={{ width: slide.w * scale, height: slide.h * scale }}
        >
          <div className="artboard-scaler" style={{ transform: `scale(${scale})`, width: slide.w, height: slide.h }}>
            <div className="artboard" style={{ width: slide.w, height: slide.h }}>
              <slide.Cmp />
            </div>
          </div>
        </div>
      </div>

      {/* top HUD */}
      <div className="hud top">
        <div className="left">
          <span className="dot"></span>
          <span style={{ color: 'rgba(246,244,239,0.85)', letterSpacing: '0.22em' }}>FabFunnel</span>
          <span>·</span>
          <span>Brand Asset Book</span>
        </div>
        <div className="center">
          <span className="pill">{slide.section}</span>
        </div>
        <div className="right">
          <button className="home-btn" onClick={() => setMenuOpen(true)} title="Contents (I)">
            <span className="glyph">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M1.5 2.2h9M1.5 6h9M1.5 9.8h6"/></svg>
            </span>
            Contents
          </button>
          <span className="pill green">{String(idx + 1).padStart(2,'0')} / {String(SLIDES.length).padStart(2,'0')}</span>
        </div>
      </div>

      {/* bottom HUD */}
      <div className="hud bottom">
        <div className="left">
          <span style={{ color: 'rgba(246,244,239,0.85)' }}>{slide.label}</span>
        </div>
        <div className="center">
          <div className="seg">
            {SLIDES.map((s, i) => (
              <span key={s.id}
                className={`tick ${i === idx ? 'active' : (i < idx ? 'done' : '')}`}
                title={s.label}
              />
            ))}
          </div>
        </div>
        <div className="right">
          <span>#/{slide.id}</span>
        </div>
      </div>

      {/* nav buttons */}
      <button className="nav-btn left" onClick={prev} disabled={idx === 0} aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="14 6 8 12 14 18"/></svg>
      </button>
      <button className="nav-btn right" onClick={next} disabled={idx === SLIDES.length - 1} aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="10 6 16 12 10 18"/></svg>
      </button>

      {/* contents / home overlay */}
      <div className={`sheet ${menuOpen ? 'open' : ''}`} onClick={(e) => { if (e.target.classList.contains('sheet')) setMenuOpen(false); }}>
        <div className="sheet-inner">
          <div className="sheet-head">
            <div>
              <div className="sheet-sub">FabFunnel · Brand Asset Book</div>
              <div className="sheet-title">Contents</div>
            </div>
            <button className="sheet-close" onClick={() => setMenuOpen(false)} aria-label="Close">×</button>
          </div>

          {groups.map(([section, items]) => (
            <div key={section} className="sec-group">
              <div className="sec-head">{section}</div>
              <div className="sec-grid">
                {items.map(it => (
                  <button
                    key={it.id}
                    className={`sec-card ${it.i === idx ? 'active' : ''}`}
                    onClick={() => jumpTo(it.i)}
                  >
                    <span className="num">{String(it.i + 1).padStart(2,'0')}</span>
                    <span className="label">{it.label}</span>
                    <span className="slug">#/{it.id}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}

          <div className="share">
            <span>Share this view</span>
            <span className="url">{window.location.href}</span>
            <button onClick={copyLink}>{copied ? 'Copied' : 'Copy link'}</button>
          </div>
        </div>
      </div>

      {/* gesture hint */}
      <div className={`hint ${hint ? 'show' : ''}`}>
        <span className="kbd">← →</span><span>Navigate</span>
        <span style={{ opacity: 0.4 }}>·</span>
        <span className="kbd">I</span><span>Index</span>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
